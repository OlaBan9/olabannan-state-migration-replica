[site]
name = "olabannan-state-migration-replica"
original_url = "https://willsigal.github.io/state-migration-analysis/migration_flow_3d.html"
description = "A 1:1 interactive recreation of the US state-to-state migration dot-flow visualization (D3 map, animated canvas corridors, year playback, filters, stats)."
category = "webcraft-2.0"
tags = ["data-visualization", "d3", "responsive", "static"]

[site.tech]
stack = ["html", "css", "javascript", "d3"]
hosting = "aws"
hosting_access_granted = true

[site.assets]
data = ["state_to_state_migration_normalized.csv", "vendor/states-10m.json"]
scripts = ["vendor/d3.min.js", "vendor/topojson-client.min.js"]

[site.prd]
file = "PRD.md"
setup = "SETUP.md"
backend = "No backend. Dependency-free static page; D3/topojson/us-atlas libraries, map geometry, and the Census migration CSV are all vendored locally. Zero network fetch at setup or runtime."

[[screenshots]]
route = "/"
file = "screenshots/replica-home.png"
device = "desktop"
side = "replica"

[[screenshots]]
route = "/"
file = "screenshots/replica-mobile.png"
device = "mobile"
side = "replica"

[task]
workstream = "web_craft"
format = "web_craft"
track_assignment = "hatch-web-design"
